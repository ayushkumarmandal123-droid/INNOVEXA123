<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Message | INNOVEXA</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>


<main class="message-container">

    <div class="message-card">

        <div class="message-header">
            <h1>Anonymous Message</h1>
            <p>Send a message through INNOVEXA</p>
        </div>

        <div class="message-form">

            <div class="form-group">
                <label for="title">Your Name</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter your name"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="subject">Your Message</label>
                <textarea
                    id="subject"
                    placeholder="Write your message..."
                    rows="5"
                ></textarea>
            </div>

            <button type="button" onclick="addTask()">
                Send Message
            </button>

        </div>

    </div>

</main>

<script>
    async function addTask() {
        const title = document.getElementById("title").value;
        const subject = document.getElementById("subject").value;

        alert("Hello! Welcome to INNOVEXA.");

        const response = await fetch("https://innovexa123-1.onrender.com/api/tasks", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                title: title,
                subject: subject
            })
        });

        const data = await response.json();

        console.log(data);
    }
</script>


</body>

</html>
